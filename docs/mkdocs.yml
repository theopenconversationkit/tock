site_name: Tock Documentation
use_directory_urls: false

# Broken links and anchors fail the strict build
validation:
  links:
    anchors: warn

repo_url: https://github.com/theopenconversationkit/tock
repo_name: theopenconversationkit/tock
edit_uri: edit/master/docs/docs/

theme:
  name: material
  logo: img/logo-white.svg
  favicon: img/favicon.ico
  icon:
    edit: material/pencil
    view: material/eye
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.highlight

hooks:
  - hooks/variables.py
  - hooks/copyapiswagger.py
  - hooks/chatbot_widget.py
  - hooks/redirects.py
  - hooks/i18n_parity.py
  - hooks/preview.py

plugins:
  - search
  - tags
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Getting started: Démarrer
            Gen AI: IA générative
            Knowledge base: Base de connaissances
            Answer generation: Génération des réponses
            Quality and improvement: Qualité et amélioration
            Enriching the NLU model: Enrichir le modèle NLU
            Stories and answers: Stories et réponses
            Language understanding: Compréhension du langage
            Monitoring: Pilotage
            Providers: Fournisseurs
            Channels: Canaux
            Develop: Développer
            Internals: Fonctionnement interne
            Operate: Exploiter
            Project: Projet
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

extra:
  # Replaced in pages by hooks/variables.py, e.g. {{ tock_version }}
  variables:
    tock_version: 26.9.0
    kotlin_version: 2.4.20

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# RAG prompt examples are linked from rag-prompt-system.md on GitHub, not rendered as pages
exclude_docs: prompt-example-type-*

