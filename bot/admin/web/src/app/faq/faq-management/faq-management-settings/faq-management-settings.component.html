<form [formGroup]="form">
  <nb-card
    class="mb-0"
    [nbSpinner]="loading"
  >
    <nb-card-header>
      <div class="d-flex justify-content-between align-items-start">
        <h4>{{ 'faq.faq-management-settings.title' | transloco }}</h4>
        <button
          type="button"
          nbButton
          ghost
          shape="round"
          [nbTooltip]="'faq.faq-management-settings.close_tooltip' | transloco"
          (click)="close()"
          data-testid="close-button"
        >
          <nb-icon icon="x-lg"></nb-icon>
        </button>
      </div>
    </nb-card-header>

    <nb-card-body>
      <p>{{ 'faq.faq-management-settings.description' | transloco }}</p>

      <div class="mb-2">
        <nb-checkbox formControlName="satisfactionEnabled">{{
          'faq.faq-management-settings.satisfaction_checkbox_label' | transloco
        }}</nb-checkbox>
      </div>

      <tock-form-control
        [label]="'faq.faq-management-settings.story_label' | transloco"
        name="story"
        [controls]="satisfactionStoryId"
        [showError]="isSubmitted"
        [required]="satisfactionEnabled.value"
      >
        <nb-select
          [placeholder]="'faq.faq-management-settings.story_placeholder' | transloco"
          formControlName="satisfactionStoryId"
          [fullWidth]="true"
          [optionsListClass]="'option-list--break-word'"
        >
          @for (story of availableStories; track story) {
          <nb-option [value]="story.storyId">
            {{ story.name }}
          </nb-option>
          }
        </nb-select>
      </tock-form-control>
    </nb-card-body>

    <nb-card-footer>
      <div class="grid-button">
        <button
          type="button"
          nbButton
          outline
          status="primary"
          size="small"
          (click)="close()"
          data-testid="cancel-button"
        >
          {{ 'faq.faq-management-settings.cancel_button' | transloco }}
        </button>
        <button
          type="button"
          nbButton
          status="primary"
          size="small"
          [disabled]="!canSave"
          (click)="save()"
        >
          {{ 'faq.faq-management-settings.save_button' | transloco }}
        </button>
      </div>
    </nb-card-footer>
  </nb-card>
</form>
