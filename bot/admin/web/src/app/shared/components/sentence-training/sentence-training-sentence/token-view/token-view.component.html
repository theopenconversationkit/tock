<span
  [nbTooltip]="'shared.token-view.entity-tooltip' | transloco: { role: token.entity?.role }"
  [nbTooltipDisabled]="!token.entity?.role"
  [ngClass]="{ token: token.entity, pointer: !readOnly && token.entity }"
  [style.background]="token.color()"
  [style.color]="getContrastYIQ(token.color())"
  [style.borderColor]="getContrastYIQ(token.color(), 'rgba(0,0,0,0.3)', 'rgba(255,255,255,0.6)')"
  (click)="displayMenu($event)"
  ><!-- NO carriage return here ! -->@if (!token.subTokens) {
  {{ token.text }}
  }@if (token.subTokens) { @for (subtoken of token.subTokens; track subtoken) {
  <tock-token-view
    [token]="subtoken"
    [readOnly]="readOnly"
    (deleteTokenEntity)="delete($event)"
  ></tock-token-view>
  } }</span
>

<ng-template #userMenu>
  <section class="token-menu pt-1">
    <button
      type="button"
      status="danger"
      nbButton
      ghost
      size="small"
      class="d-block w-100"
      (click)="delete(token)"
    >
      <nb-icon icon="trash"></nb-icon>
      {{ 'shared.token-view.remove-entity' | transloco: { entityName: getEntityName() } }}
    </button>
  </section>
</ng-template>
