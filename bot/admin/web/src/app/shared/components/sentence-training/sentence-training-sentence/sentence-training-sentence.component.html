<div [ngClass]="{ 'px-3': !readOnly }">
  <div
    class="tokens-container-wrapper"
    [ngClass]="{ fontSmall: fontsize === 'small' }"
  >
    <div
      class="tokens-container"
      #tokensContainer
    >
      @for (token of tokens; track token) {
      <tock-token-view
        [token]="token"
        [readOnly]="readOnly"
        (deleteTokenEntity)="deleteTokenEntity($event)"
      ></tock-token-view>
      }
    </div>
  </div>

  @if (selection) {
  <div class="my-3">
    <div class="text-muted font-size-small">
      {{ 'shared.sentence-training-sentence.assign-entity-to' | transloco }} <strong>"{{ getSelectionText() }}"</strong> :
    </div>
    @for (entity of getAssignableEntities(); track entity) {
    <div
      class="token-selector pointer"
      [style.background-color]="entity.entityColor"
      [style.color]="getContrastYIQ(entity.entityColor)"
      [nbTooltip]="'shared.sentence-training-sentence.assign-entity-tooltip' | transloco: { entityName: entity.qualifiedName(state.user) }"
      (click)="assignEntity(entity)"
    >
      {{ entity.qualifiedName(state.user) }}
    </div>
    }
    <button
      nbButton
      ghost
      size="small"
      (click)="createEntity()"
    >
      <nb-icon icon="plus-lg"></nb-icon>
      {{ 'shared.sentence-training-sentence.add-entity' | transloco }}
    </button>
  </div>
  }
</div>
