@if (sentence.text) { @if (sentence.userInterface) {
<img
  src="/assets/images/{{ sentence.userInterface }}.svg"
  class="userInterface"
  nbTooltip="{{ sentence.userInterface }}"
/>
} @if (reply) {
<tock-chat-ui-display-markup
  [sentence]="sentence"
  [formatting]="formatting"
></tock-chat-ui-display-markup>
} @if (!reply) {
<span>{{ sentence.text }}</span>
} } @if (!sentence.text) { @if (sentence.messages.length === 1) {
<tock-chat-ui-message-sentence-element
  [element]="sentence.messages[0]"
  [replay]="replay"
  [reply]="reply"
  (sendMessage)="replyMessage($event)"
></tock-chat-ui-message-sentence-element>
} @if (sentence.messages.length > 1) {
<ul>
  @for (e of sentence.messages; track e) {
  <li>
    ({{ e.connectorType.id }})
    <tock-chat-ui-message-sentence-element
      [element]="e"
      [replay]="replay"
      [reply]="reply"
    ></tock-chat-ui-message-sentence-element>
  </li>
  }
</ul>
} }
