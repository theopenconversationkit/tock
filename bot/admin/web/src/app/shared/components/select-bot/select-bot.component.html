<div *ngIf="configurations && configurations.length === 0">{{ 'common.messages.noBotConfiguration' | transloco }}&nbsp;</div>
<div
  *ngIf="configurations && configurations.length !== 0"
  class="gap-1"
  [ngClass]="{ 'd-flex': displayConnectorChoice && currentBotName !== 'None' }"
>
  <span
    class="select-configuration w-50 lineHeight-1"
    *ngIf="botNames && (allowNoSelection || botNames.length > 1)"
  >
    <nb-form-field [nbTooltip]="'shared.select-bot.selectConfigurationTooltip' | transloco">
      <nb-icon
        nbPrefix
        icon="link-45deg"
      ></nb-icon>
      <nb-select
        (selectedChange)="changeBotName()"
        [size]="size"
        [placeholder]="'shared.select-bot.selectConfigurationPlaceholder' | transloco"
        [(ngModel)]="currentBotName"
        class="select-width"
        fullWidth
        [disabled]="disabled"
      >
        <nb-option
          *ngIf="allowNoSelection"
          value="None"
          >{{ noConfigurationLabel }}</nb-option
        >
        <nb-option
          *ngFor="let n of botNames"
          [value]="n"
          >{{ n }}</nb-option
        >
      </nb-select>
    </nb-form-field>
  </span>
  <span
    *ngIf="displayConnectorChoice && currentBotName !== 'None'"
    class="select-configuration lineHeight-1"
    [class.w-50]="botNames && (allowNoSelection || botNames.length > 1)"
  >
    <nb-form-field [nbTooltip]="'shared.select-bot.selectConnectorTooltip' | transloco">
      <nb-icon
        nbPrefix
        icon="plug"
      ></nb-icon>
      <nb-select
        (selectedChange)="changeConnectorType()"
        [size]="size"
        [placeholder]="'shared.select-bot.selectConnectorPlaceholder' | transloco"
        [(ngModel)]="currentConfiguration"
        class="select-width"
        fullWidth
        [disabled]="disabled"
      >
        <nb-option
          *ngIf="allowNoConfigurationSelection"
          value=""
          >{{ noConnectorLabel }}</nb-option
        >
        <nb-option
          *ngFor="let c of currentConfigurations"
          [value]="c"
        >
          <img
            src="{{ c.connectorType.iconUrl() }}"
            class="connector-icon"
          />
          {{ c.connectorType.label() }} ( {{ c.applicationId }})</nb-option
        >
      </nb-select>
    </nb-form-field>
  </span>
  <ng-content></ng-content>
</div>
