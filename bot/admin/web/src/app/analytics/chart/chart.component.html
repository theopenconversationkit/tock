<nb-flip-card
  [showToggleButton]="false"
  [flipped]="isFlipped"
  *ngIf="mainChart || altChart"
  style="min-height: 60vh"
>
  <nb-card-front>
    <nb-card>
      <nb-card-header style="padding-right: 0">
        {{ title }}
        <button
          *ngIf="!isFullScreen"
          nbButton
          ghost
          status="info"
          shape="round"
          (click)="expand()"
          [nbTooltip]="'analytics.chart.expandTooltip' | transloco"
          style="float: right"
        >
          <nb-icon icon="arrows-angle-expand"></nb-icon>
        </button>
        <button
          nbButton
          ghost
          status="info"
          shape="round"
          (click)="onCsvAction()"
          [nbTooltip]="'analytics.chart.exportCsvTooltip' | transloco"
          style="float: right"
        >
          <nb-icon icon="download"></nb-icon>
        </button>
        <button
          *ngIf="type !== 'PieChart' && isMultiChart === true"
          nbButton
          ghost
          status="info"
          shape="round"
          (click)="changeChartType('PieChart')"
          [nbTooltip]="'analytics.chart.pieChartTooltip' | transloco"
          style="float: right"
        >
          <nb-icon icon="pie-chart"></nb-icon>
        </button>
        <button
          *ngIf="type === 'PieChart' && isMultiChart === true"
          nbButton
          ghost
          status="info"
          shape="round"
          (click)="changeChartType('line')"
          [nbTooltip]="'analytics.chart.lineChartTooltip' | transloco"
          style="float: right"
        >
          <nb-icon icon="graph-up"></nb-icon>
        </button>
      </nb-card-header>
      <nb-card-body
        [nbSpinner]="isLoading"
        nbSpinnerStatus="primary"
      >
        <div style="text-align: right">
          <nb-select
            multiple
            status="primary"
            *ngIf="displayMultipleSelectComponent()"
            style="min-width: 15rem; max-width: 20rem"
            size="small"
            [(selected)]="seriesSelectionList"
            (selectedChange)="updateGraph()"
          >
            <nb-select-label>
              {{ 'analytics.chart.nbSelectedLabel' | transloco: { count: seriesSelectionList.length } }}
            </nb-select-label>
            <nb-option
              *ngFor="let c of data.connectorsType; index as i"
              [value]="i"
              >{{ c }}</nb-option
            >
          </nb-select>
          <nb-select
            class="select-intent"
            status="primary"
            [placeholder]="'analytics.chart.intentPlaceholder' | transloco"
            *ngIf="intentsList.length > 0"
            (selectedChange)="refresh()"
            [(ngModel)]="filter.intent"
          >
            <nb-option value="">{{ 'analytics.chart.allIntentsOption' | transloco }}</nb-option>
            <nb-option
              *ngFor="let intent of intentsList"
              [value]="intent"
              >{{ intent }}</nb-option
            >
          </nb-select>
        </div>

        <div style="display: flex">
          <div
            echarts
            [options]="chartOptions"
            *ngIf="chartOptions"
            [style.width]="'100%'"
          ></div>
        </div>
      </nb-card-body>
      <nb-card-body> </nb-card-body>
    </nb-card>
  </nb-card-front>
  <nb-card-back>
    <nb-card>
      <nb-card-body> </nb-card-body>
      <nb-card-footer>
        <button
          nbButton
          shape="round"
          (click)="onFlipAction()"
          [nbTooltip]="'analytics.chart.showChartTooltip' | transloco"
          status="success"
          style="float: right"
        >
          <nb-icon [icon]="chartIcon()"></nb-icon>
        </button>
        <button
          nbButton
          outline
          shape="round"
          (click)="onCsvAction()"
          [nbTooltip]="'analytics.chart.exportCsvTooltip' | transloco"
          status="primary"
          style="float: right; margin-right: 20px"
        >
          CSV <nb-icon icon="download"></nb-icon>
        </button>
      </nb-card-footer>
    </nb-card>
  </nb-card-back>
</nb-flip-card>
