<nb-card status="primary">
  <nb-card-header>{{ 'applications.display-user-data.title' | transloco }}</nb-card-header>
  <nb-card-body class="no-padding">
    <json-editor
      [options]="editorOptions"
      [data]="data"
    ></json-editor>
  </nb-card-body>
  <nb-card-footer class="btn-align">
    <button
      nbButton
      status="primary"
      (click)="close()"
    >
      {{ 'applications.display-user-data.closeButton' | transloco }}
    </button>
  </nb-card-footer>
</nb-card>
