<nb-card>
  <nb-card-header class="d-flex justify-content-between align-items-start gap-1">
    {{ 'test.nlp-stats-display.title' | transloco }}
    <button
      nbButton
      ghost
      shape="round"
      [nbTooltip]="'common.actions.close' | transloco"
      (click)="cancel()"
    >
      <nb-icon icon="x-lg"></nb-icon>
    </button>
  </nb-card-header>

  <nb-card-body>
    <strong>{{ 'test.nlp-stats-display.requestLabel' | transloco }}</strong>
    <pre>{{ data.request }}</pre>

    <strong>{{ 'test.nlp-stats-display.responseLabel' | transloco }}</strong>
    <pre>{{ data.response }}</pre>
  </nb-card-body>
</nb-card>
