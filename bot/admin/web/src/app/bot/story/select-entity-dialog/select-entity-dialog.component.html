<nb-card class="m-0">
  <nb-card-header class="d-flex justify-content-between align-items-start gap-1 flex-wrap">
    {{ 'bot.select-entity-dialog.title' | transloco }}
    <button
      type="button"
      nbButton
      ghost
      shape="round"
      [nbTooltip]="'common.actions.close' | transloco"
      (click)="cancel()"
    >
      <nb-icon icon="x-lg"></nb-icon>
    </button>
  </nb-card-header>
  <nb-card-body>
    <tock-form-control
      *ngIf="generate"
      [label]="'bot.select-entity-dialog.intentLabel' | transloco"
      name="intent"
      [information]="'bot.select-entity-dialog.intentInformation' | transloco"
    >
      <input
        nbInput
        name="intent"
        [placeholder]="'bot.select-entity-dialog.intentPlaceholder' | transloco"
        fullWidth
        fieldSize="small"
        autocomplete="off"
        [nbAutocomplete]="intentAuto"
        [(ngModel)]="intent.name"
        (keyup)="onIntentChange($any($event.target))"
        (focus)="onIntentChange($any($event.target))"
      />
    </tock-form-control>

    <tock-form-control
      [label]="'bot.select-entity-dialog.entityLabel' | transloco"
      name="entity"
    >
      <nb-tag-list>
        <nb-tag
          *ngFor="let e of entities"
          class="pointer"
          [text]="e.nameWithoutNamespace(stateService.currentApplication.namespace)"
          [status]="e === selectedEntity ? 'info' : e.dictionary ? 'success' : 'basic'"
          (click)="selectEntityType(e)"
        ></nb-tag>
      </nb-tag-list>
      <small
        *ngIf="!entities?.length"
        class="font-italic"
      >
        {{ 'bot.select-entity-dialog.noValueFound' | transloco }}
      </small>
    </tock-form-control>
    <tock-form-control
      [label]="'bot.select-entity-dialog.withRoleLabel' | transloco"
      name="role"
    >
      <input
        nbInput
        id="role"
        fieldSize="small"
        fullWidth
        [placeholder]="'bot.select-entity-dialog.rolePlaceholder' | transloco"
        [(ngModel)]="role"
      />
    </tock-form-control>
    <tock-form-control
      *ngIf="!generate && entityValues.length !== 0"
      [label]="'bot.select-entity-dialog.entityValueLabel' | transloco"
      name="entityValue"
    >
      <nb-tag-list>
        <nb-tag
          *ngFor="let e of entityValues"
          class="pointer"
          [text]="e"
          status="info"
          (click)="selectEntityValue(e)"
        ></nb-tag>
      </nb-tag-list>
    </tock-form-control>
  </nb-card-body>
  <nb-card-footer class="card-footer-actions">
    <button
      nbButton
      ghost
      size="small"
      (click)="cancel()"
    >
      {{ 'common.actions.cancel' | transloco }}
    </button>
    <button
      *ngIf="generate"
      nbButton
      size="small"
      status="primary"
      [disabled]="!selectedEntity || !role"
      (click)="validateEntity()"
    >
      {{ 'bot.select-entity-dialog.generateButton' | transloco }}
    </button>
    <button
      *ngIf="!generate"
      nbButton
      size="small"
      status="danger"
      (click)="removeEntityValue()"
    >
      {{ 'bot.select-entity-dialog.removeButton' | transloco }}
    </button>
    <button
      *ngIf="!generate"
      nbButton
      size="small"
      status="primary"
      (click)="validateEntityValue()"
    >
      {{ 'bot.select-entity-dialog.changeButton' | transloco }}
    </button>
  </nb-card-footer>
</nb-card>

<nb-autocomplete
  #intentAuto
  [activeFirst]="true"
>
  <nb-option-group
    *ngFor="let category of currentIntentCategories"
    [title]="category.category"
  >
    <nb-option
      *ngFor="let intent of category.intents"
      [value]="intent.name"
    >
      {{ intent.intentLabel() }}
    </nb-option>
  </nb-option-group>
</nb-autocomplete>
