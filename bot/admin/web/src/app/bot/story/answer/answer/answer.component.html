<div *ngIf="answer && answer.currentAnswer()">
  <div *ngIf="!fullDisplay">
    <span class="simple">{{ answer.simpleTextView(wide) }}</span>
    <button
      *ngIf="editable"
      nbButton
      ghost
      shape="round"
      [nbTooltip]="'bot.answer.editTooltip' | transloco: { answerLabel: answerLabel }"
      [size]="editableIconSize"
      (click)="$event.stopPropagation(); editAnswer()"
    >
      <nb-icon icon="chat-right-quote"></nb-icon>
    </button>
  </div>

  <div
    *ngIf="fullDisplay"
    class="fullDisplay"
  >
    <tock-form-control
      [label]="'bot.answer.typeLabel' | transloco"
      name="answer-type-label"
    >
      <nb-radio-group
        [(ngModel)]="answerType"
        (ngModelChange)="changeType($event)"
        class="d-flex"
      >
        <nb-radio [value]="0">{{ 'bot.answer.simpleAnswerLabel' | transloco }}</nb-radio>
        <nb-radio
          *ngIf="shared.configuration && shared.configuration.compilerAvailable"
          [value]="2"
        >
          {{ 'bot.answer.scriptAnswerLabel' | transloco }}
        </nb-radio>
      </nb-radio-group>
    </tock-form-control>

    <div *ngIf="answer.isSimpleAnswer()">
      <tock-simple-answer
        [container]="answer"
        [submit]="submit"
        [answerLabel]="answerLabel"
      ></tock-simple-answer>
    </div>
    <div *ngIf="answer.isScriptAnswer()">
      <tock-script-answer [container]="answer"></tock-script-answer>
    </div>
  </div>
</div>
