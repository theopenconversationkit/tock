<h1>{{ 'bot.create-story.title' | transloco }}</h1>

<nb-card class="sentence mt-2">
  <nb-card-body>
    <tock-select-bot
      [(configurationId)]="botConfigurationId"
      [displayConnectorChoice]="false"
    >
      <nb-card
        [nbSpinner]="loading"
        nbSpinnerStatus="primary"
        class="mb-0"
      >
        <nb-card-body>
          @if (story) {
          <span class="sentence-input">
            <input
              nbInput
              status="primary"
              class="phrase"
              [(ngModel)]="story.userSentence"
              [disabled]="loading"
              [placeholder]="'bot.create-story.userSentencePlaceholder' | transloco"
              #newSentence
              (keyup.enter)="onSentence(newSentence.value)"
            />
          </span>
          }
          <button
            nbButton
            outline
            status="primary"
            [disabled]="!(story && story.userSentence.length !== 0) || loading"
            (click)="onSentence()"
          >
            {{ 'common.actions.add' | transloco }}
          </button>
        </nb-card-body>
      </nb-card>
      @if (displayStory) {
      <div>
        <tock-story
          class="story"
          [story]="story"
          [fullDisplay]="true"
          [displaySteps]="true"
          [submit]="submit"
        ></tock-story>
      </div>
      }
    </tock-select-bot>
  </nb-card-body>

  @if (displayStory) {
  <nb-card-footer class="card-footer-actions">
    <button
      (click)="resetState()"
      nbButton
      ghost
      size="small"
    >
      <nb-icon icon="x-lg"></nb-icon>
      {{ 'common.actions.cancel' | transloco }}
    </button>
    <button
      (click)="onReply()"
      nbButton
      size="small"
      status="primary"
    >
      <nb-icon icon="plus"></nb-icon>
      {{ 'bot.create-story.createStoryButton' | transloco }}
    </button>
  </nb-card-footer>
  }
</nb-card>

@if (displayStory) {
<div class="current-analysis text-center mb-4">
  {{ 'bot.create-story.orQualifyLabel' | transloco }}
</div>
} @if (sentence) {
<tock-sentence-training-entry
  [standAlone]="true"
  [sentence]="sentence"
  (onClearSentence)="resetState()"
></tock-sentence-training-entry>
}
