<nb-card class="mb-2">
  <nb-card-header>
    <div class="d-flex justify-content-between align-items-start gap-1">
      <div class="pt-1">{{ 'quality.sample-create-from-run.title' | transloco }}</div>

      <button
        type="button"
        nbButton
        shape="round"
        [nbTooltip]="'quality.sample-create-from-run.close_tooltip' | transloco"
        (click)="dialogRef.close()"
      >
        <nb-icon icon="x-lg"></nb-icon>
      </button>
    </div>
  </nb-card-header>

  <nb-card-body>
    <form [formGroup]="form">
      <div class="row">
        <div class="col-12">
          <tock-form-control
            name="name"
            [label]="'quality.sample-create-from-run.sample_name_label' | transloco"
            [controls]="getFormControl('name')"
            [showError]="isSubmitted"
          >
            <nb-form-field>
              <input
                nbInput
                fullWidth
                [placeholder]="'quality.sample-create-from-run.sample_name_placeholder' | transloco"
                formControlName="name"
              />
            </nb-form-field>
          </tock-form-control>
        </div>

        <div class="col-12">
          <tock-form-control
            name="description"
            [label]="'quality.sample-create-from-run.description_label' | transloco"
            [controls]="getFormControl('description')"
            [showError]="isSubmitted"
          >
            <nb-form-field>
              <textarea
                nbInput
                fullWidth
                rows="3"
                [placeholder]="'quality.sample-create-from-run.description_placeholder' | transloco"
                formControlName="description"
              ></textarea>
            </nb-form-field>
          </tock-form-control>
        </div>
      </div>
    </form>
  </nb-card-body>

  <nb-card-footer class="card-footer-actions">
    <div class="d-flex gap-1">
      <button
        nbButton
        ghost="true"
        [disabled]="isLoading"
        tabindex="-1"
        (click)="dialogRef.close()"
      >
        {{ 'quality.sample-create-from-run.cancel_button' | transloco }}
      </button>

      <button
        nbButton
        status="primary"
        [nbTooltip]="'quality.sample-create-from-run.create_tooltip' | transloco"
        class="d-flex align-items-center"
        [nbSpinner]="isLoading"
        [disabled]="isLoading"
        (click)="submit()"
      >
        <nb-icon
          icon="plus-lg"
          class="mr-2"
        ></nb-icon>
        {{ 'quality.sample-create-from-run.create_button' | transloco }}
      </button>
    </div>
  </nb-card-footer>
</nb-card>
