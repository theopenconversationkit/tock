<nb-card class="mb-2">
  <nb-card-header class="d-flex justify-content-between align-items-start gap-1">
    <div class="pt-1">{{ 'quality.sample-create.title' | transloco }}</div>
    <button
      type="button"
      nbButton
      shape="round"
      nbTooltip="Close"
      (click)="dialogRef.close('cancel')"
    >
      <nb-icon icon="x-lg"></nb-icon>
    </button>
  </nb-card-header>

  <nb-card-body>
    <form [formGroup]="form">
      <div class="row">
        <div class="col-12">
          <tock-form-control
            name="name"
            [label]="'quality.sample-create.name_label' | transloco"
            [controls]="getFormControl('name')"
            [showError]="isSubmitted"
            [required]="true"
          >
            <nb-form-field>
              <input
                nbInput
                fullWidth
                [placeholder]="'quality.sample-create.name_placeholder' | transloco"
                formControlName="name"
              />
            </nb-form-field>
          </tock-form-control>
        </div>

        <div class="col-12">
          <tock-form-control
            name="description"
            [label]="'quality.sample-create.description_label' | transloco"
            [controls]="getFormControl('description')"
            [showError]="isSubmitted"
          >
            <nb-form-field>
              <textarea
                nbInput
                fullWidth
                [placeholder]="'quality.sample-create.description_placeholder' | transloco"
                formControlName="description"
              ></textarea>
            </nb-form-field>
          </tock-form-control>
        </div>

        <div class="col-12 col-lg-4">
          <tock-form-control
            name="requestedDialogCount"
            [label]="'quality.sample-create.dialogues_label' | transloco"
            [controls]="getFormControl('requestedDialogCount')"
            [showError]="isSubmitted"
          >
            <nb-form-field>
              <nb-icon
                nbPrefix
                icon="list-ol"
              ></nb-icon>
              <nb-select
                fullWidth
                [nbTooltip]="'quality.sample-create.dialogues_tooltip' | transloco"
                [placeholder]="'quality.sample-create.dialogues_placeholder' | transloco"
                formControlName="requestedDialogCount"
              >
                <nb-option
                  *ngFor="let option of nbDialogOptions"
                  [value]="option.value"
                >
                  {{ option.label }}
                </nb-option>
              </nb-select>
            </nb-form-field>
          </tock-form-control>
        </div>

        <div class="col-6 col-lg-4">
          <tock-form-control
            name="dialogActivityFrom"
            [label]="'quality.sample-create.start_date_label' | transloco"
            [controls]="getFormControl('dialogActivityFrom')"
            [showError]="isSubmitted"
            [required]="true"
          >
            <nb-form-field>
              <nb-icon
                nbPrefix
                icon="calendar-plus"
              ></nb-icon>
              <input
                nbInput
                fullWidth
                [placeholder]="'quality.sample-create.start_date_placeholder' | transloco"
                [nbTooltip]="'quality.sample-create.start_date_tooltip' | transloco"
                [nbDatepicker]="from_date"
                formControlName="dialogActivityFrom"
              />
            </nb-form-field>
          </tock-form-control>
          <nb-date-timepicker
            #from_date
            [step]="10"
            singleColumn
            format="y/MM/dd HH:mm"
            [showCurrentTimeButton]="false"
          ></nb-date-timepicker>
        </div>

        <div class="col-6 col-lg-4">
          <tock-form-control
            name="dialogActivityTo"
            [label]="'quality.sample-create.end_date_label' | transloco"
            [controls]="getFormControl('dialogActivityTo')"
            [showError]="isSubmitted"
            [required]="true"
          >
            <nb-form-field>
              <nb-icon
                nbPrefix
                icon="calendar-minus"
              ></nb-icon>
              <input
                nbInput
                fullWidth
                [placeholder]="'quality.sample-create.end_date_placeholder' | transloco"
                [nbTooltip]="'quality.sample-create.end_date_tooltip' | transloco"
                [nbDatepicker]="to_date"
                formControlName="dialogActivityTo"
              />
            </nb-form-field>
          </tock-form-control>
          <nb-date-timepicker
            #to_date
            [step]="10"
            singleColumn
            format="y/MM/dd HH:mm"
            [showCurrentTimeButton]="false"
          ></nb-date-timepicker>
        </div>

        <div class="col-6 col-lg-4">
          <tock-form-control
            name="allowTestDialogs"
            [controls]="getFormControl('allowTestDialogs')"
            [showError]="isSubmitted"
          >
            <nb-checkbox
              [nbTooltip]="'quality.sample-create.allow_test_dialogs_tooltip' | transloco"
              class="text-nowrap"
              formControlName="allowTestDialogs"
            >
              {{ 'quality.sample-create.allow_test_dialogs_label' | transloco }}
            </nb-checkbox>
          </tock-form-control>
        </div>
      </div>
    </form>
  </nb-card-body>

  <nb-card-footer class="card-footer-actions">
    <button
      nbButton
      ghost="true"
      (click)="dialogRef.close('cancel')"
    >
      {{ 'quality.sample-create.cancel_button' | transloco }}
    </button>

    <button
      nbButton
      status="primary"
      [nbTooltip]="'quality.sample-create.create_tooltip' | transloco"
      class="d-flex align-items-center"
      (click)="createSample()"
    >
      <nb-icon
        icon="plus-lg"
        class="mr-2"
      ></nb-icon>
      {{ 'quality.sample-create.create_button' | transloco }}
    </button>
  </nb-card-footer>
</nb-card>
