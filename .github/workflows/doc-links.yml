name: Check documentation links

# Weekly check of the links of the documentation, including external links.
# Non-blocking: broken links are reported in a single GitHub issue, updated by each run
# and closed once all the links work again.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

env:
  ISSUE_TITLE: '[Doc] Broken links in the documentation'

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config docs/lychee.toml --no-progress 'docs/docs/**/*.md'
          output: lychee/out.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the open report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh issue list --state open --label documentation --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: ${{ env.ISSUE_TITLE }}
          content-filepath: lychee/out.md
          labels: documentation
          issue-number: ${{ steps.report.outputs.number }}

      - name: Close the report once the links are fixed
        if: steps.lychee.outputs.exit_code == 0 && steps.report.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.report.outputs.number }}
        run: gh issue close "$NUMBER" --comment "All the links of the documentation work again (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
