name: Release setup
description: >
  Sets up the JDK and Maven for a job of the release workflow: Maven Central server and signing key, artifacts of the
  previous release jobs in the local Maven repository, and git identity and credentials of the release GitHub App

inputs:
  dry-run:
    description: "'true' in dry run: no signing key nor git credentials"
    required: true
  gpg-private-key:
    description: Armored private key signing the artifacts (not used in dry run)
    required: false
    default: ''
  app-token:
    description: Token of the release GitHub App, used to push the commits and the tags (not used in dry run)
    required: false
    default: ''
  app-slug:
    description: Slug of the release GitHub App, for the git identity (not used in dry run)
    required: false
    default: ''
  download-artifacts:
    description: "'true' to install the Maven artifacts released by the previous jobs (artifacts maven-*)"
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # settings.xml reads the credentials from CENTRAL_USERNAME / CENTRAL_TOKEN, and maven-gpg-plugin the passphrase from
    # MAVEN_GPG_PASSPHRASE: the release steps define these variables
    - name: Setup Java JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_TOKEN
        gpg-private-key: ${{ inputs.dry-run != 'true' && inputs.gpg-private-key || '' }}

    # the artifacts released by the previous jobs, so that this job does not wait for their sync on Maven Central
    - name: Install the artifacts of the previous jobs
      if: inputs.download-artifacts == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: maven-*
        merge-multiple: true
        path: ~/.m2/repository/ai/tock

    - name: Configure git
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        APP_TOKEN: ${{ inputs.app-token }}
        APP_SLUG: ${{ inputs.app-slug }}
      run: |
        if [ "$DRY_RUN" = "true" ]; then
          git config --global user.name "tock-release-dry-run"
          git config --global user.email "tock-release-dry-run@users.noreply.github.com"
          exit 0
        fi
        user_id="$(GH_TOKEN="$APP_TOKEN" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
        git config --global user.name "${APP_SLUG}[bot]"
        git config --global user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
        # the scm of the poms is git@github.com:...: the release plugin pushes with the token of the App
        git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "git@github.com:"
        git config --global --add url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "https://github.com/"
